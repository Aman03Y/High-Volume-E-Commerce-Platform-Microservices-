server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          routes:

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

            - id: inventory-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/inventory/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/orders/**